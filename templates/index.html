<!DOCTYPE html>
<html>
<head><title>Match Predictor</title></head>
<body>
    <h1>Live Match Analysis</h1>
    <video id="video" width="640" height="480" autoplay playsinline></video>
    <p>Status: <span id="prediction">Initializing...</span></p>

    <script>
        const video = document.getElementById('video');
        const predictionText = document.getElementById('prediction');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; });

        setInterval(async () => {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append("image", blob); // MUST MATCH request.files['image']

                try {
                    const response = await fetch("/predict", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    predictionText.innerText = "Players detected: " + (data.player_count || 0);
                } catch (err) {
                    console.error("Upload failed", err);
                }
            }, "image/jpeg");
        }, 1500); // 1.5 seconds to reduce load
    </script>
</body>
</html>
